<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0c10;
      color: #ffffff;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* --- Stylish Background Effect --- */
    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.45;
    }

    /* Top-left glowing ambient light */
    body::before {
      width: 400px;
      height: 400px;
      background: #3b82f6; /* Accent Blue */
      top: -10%;
      left: -10%;
    }

    /* Bottom-right glowing ambient light */
    body::after {
      width: 450px;
      height: 450px;
      background: #8b5cf6; /* Accent Purple */
      bottom: -10%;
      right: -10%;
    }

    /* Card Container */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background-color: #16171b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    .title {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2rem;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    /* Form Elements */
    .form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .row {
      display: flex;
      gap: 1rem;
    }

    .row .field-group {
      flex: 1;
    }

    .field-group {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .input-field {
      width: 100%;
      background-color: #1c1e24;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field::placeholder {
      color: #8e95a5;
    }

    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* Password Input with Eye Icon */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper .input-field {
      padding-right: 3rem;
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #8e95a5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
    }

    .toggle-password:hover {
      color: #ffffff;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    /* Footer Text */
    .footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #9ca3af;
    }

    .footer-text a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
      margin-left: 0.25rem;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    /* Responsive adjustment for small devices */
    @media (max-width: 480px) {
      .row {
        flex-direction: column;
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Create your account</h1>
    
    <form class="form" onsubmit="event.preventDefault();">
      <!-- First & Last Name Row -->
      <div class="row">
        <div class="field-group">
          <input type="text" class="input-field" placeholder="First name" required />
        </div>
        <div class="field-group">
          <input type="text" class="input-field" placeholder="Last name" required />
        </div>
      </div>

      <!-- Email Input -->
      <div class="field-group">
        <input type="email" class="input-field" placeholder="Email address" required />
      </div>

      <!-- Password Input -->
      <div class="field-group password-wrapper">
        <input type="password" id="password" class="input-field" placeholder="Password" required />
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
          <!-- Eye Icon SVG -->
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">Create account</button>
    </form>

    <!-- Footer -->
    <p class="footer-text">
      Already have an account? <a href="#">Sign in</a>
    </p>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
    }
  </script>

</body>
</html>
