<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth UI - Bunnyband Style</title>
  <style>
    /* Global Reset & Dark Theme Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0d0e;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Outer Container / Card Style */
    .auth-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .auth-title {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    /* Form Layouts */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Custom Input Controls */
    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-field {
      width: 100%;
      background-color: #0f0f11;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field::placeholder {
      color: #71717a;
    }

    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Password Toggle Icon */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #71717a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: #ffffff;
    }

    /* Buttons */
    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Dynamic Switch Link */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: #a1a1aa;
    }

    .auth-link {
      color: #3b82f6;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: text-decoration 0.2s ease;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    /* Animation utility */
    .fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="auth-card fade-in">
    <h2 class="auth-title" id="form-title">Create your account</h2>

    <form id="auth-form" onsubmit="event.preventDefault();">
      <div class="form-group">
        <!-- Names grid (Hidden dynamically during Sign In) -->
        <div class="grid-2" id="name-fields">
          <div class="input-wrapper">
            <input type="text" class="input-field" placeholder="First name" required />
          </div>
          <div class="input-wrapper">
            <input type="text" class="input-field" placeholder="Last name" required />
          </div>
        </div>

        <!-- Email -->
        <div class="input-wrapper">
          <input type="email" class="input-field" placeholder="Email address" required />
        </div>

        <!-- Password -->
        <div class="input-wrapper">
          <input type="password" id="password-field" class="input-field" placeholder="Password" required />
          <button type="button" class="toggle-password" id="toggle-pwd-btn" aria-label="Toggle password view">
            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submit-btn">Create account</button>
      </div>
    </form>

    <!-- Switch Mode Link -->
    <div class="auth-footer" id="auth-footer">
      Already have an account? <span class="auth-link" id="switch-mode-btn">Sign in</span>
    </div>
  </div>

  <script>
    // State Tracker
    let isSignUp = true;

    // Element References
    const formTitle = document.getElementById('form-title');
    const nameFields = document.getElementById('name-fields');
    const submitBtn = document.getElementById('submit-btn');
    const authFooter = document.getElementById('auth-footer');
    const switchModeBtn = document.getElementById('switch-mode-btn');
    const passwordField = document.getElementById('password-field');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const eyeIcon = document.getElementById('eye-icon');

    // Dynamic View Switcher (Sign Up <-> Sign In)
    switchModeBtn.addEventListener('click', () => {
      isSignUp = !isSignUp;

      if (isSignUp) {
        formTitle.textContent = 'Create your account';
        nameFields.style.display = 'grid';
        submitBtn.textContent = 'Create account';
        authFooter.innerHTML = 'Already have an account? <span class="auth-link" id="switch-mode-btn">Sign in</span>';
      } else {
        formTitle.textContent = 'Welcome back';
        nameFields.style.display = 'none';
        submitBtn.textContent = 'Sign in';
        authFooter.innerHTML = 'Don\'t have an account? <span class="auth-link" id="switch-mode-btn">Sign up</span>';
      }

      // Re-bind click event to newly created link DOM node
      document.getElementById('switch-mode-btn').addEventListener('click', arguments.callee);
    });

    // Toggle Password Visibility
    togglePwdBtn.addEventListener('click', () => {
      const isPassword = passwordField.type === 'password';
      passwordField.type = isPassword ? 'text' : 'password';

      // Switch SVG icon design dynamically
      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });
  </script>
</body>
</html>
