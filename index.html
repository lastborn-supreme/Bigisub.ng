<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bigisub.ng | Login</title>
  <style>
    /* CSS Variables for Easy Customization */
    :root {
      --bg-gradient: radial-gradient(circle at top, #1a2332 0%, #0a0d14 100%);
      --card-bg: rgba(22, 28, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: #111622;
      --input-border: #242e42;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-label: #cbd5e1;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Auth Card Container */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Header Section */
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-label);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: #475569;
    }

    .form-input:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    /* Password Toggle Icon Button */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: var(--text-main);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      background: var(--accent-green);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }

    .btn-submit:hover {
      background: var(--accent-green-hover);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Footer Links */
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .auth-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .auth-link:hover {
      color: var(--accent-blue);
      text-decoration: underline;
    }

    .divider {
      margin: 0 8px;
      color: #334155;
    }

    /* Entry Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <h1 class="brand-title">Bigisub.ng</h1>
      <p class="brand-subtitle">Log in to access your account</p>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <!-- Username / Phone -->
      <div class="form-group">
        <label for="user-input" class="form-label">Username / Phone</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="user-input" 
            class="form-input" 
            placeholder="Enter username or phone number" 
            required 
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password-input" class="form-label">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password-input" 
            class="form-input" 
            placeholder="Enter password" 
            required 
          />
          <button type="button" class="toggle-password" id="toggle-pwd-btn" aria-label="Toggle password view">
            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit CTA -->
      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <!-- Links Footer -->
    <div class="auth-footer">
      <a href="#" class="auth-link">Forgot password?</a>
      <span class="divider">|</span>
      <a href="#" class="auth-link">Create account</a>
    </div>
  </div>

  <script>
    // Password Toggle Functionality
    const passwordInput = document.getElementById('password-input');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const eyeIcon = document.getElementById('eye-icon');

    togglePwdBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';

      // Update Eye Icon Dynamic View
      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // Dummy Submit Handler
    function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('user-input').value;
      alert(`Logging in user: ${username}`);
    }
  </script>

</body>
</html>
